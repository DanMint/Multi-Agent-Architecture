  # this workflow checks that the registry works if it gets modified
  name: Agent registry check

  on: 
    push:
      branches: [main, master]
      paths:
        - 'src/infra/agentRegistry.py'
        - 'tests/test_registry.py'
        - '.github/workflows/agent_registry_check.yaml'

    pull_request:
      branches: [main, master]
      paths:
       - 'src/infra/agentRegistry.py'
       - 'tests/test_registry.py'
       - '.github/workflows/agent_registry_check.yaml'

  jobs:
    test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: set up Python
          uses: actions/setup-python@v5
          with:
            python-versions: '3.12'

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install pytest fastapi httpx uvicorn

        - name: Run registry tests
          run: python -m pytest tests/test_agent_registry.py -v
          