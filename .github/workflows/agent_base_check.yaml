# this workflow checks that base agent works if modified
name: Base agent check

on:
  push:
    branches: [main, master]
    paths:
      - 'src/agent/base.py'
      - 'tests/test_base_agent.py'
      - '.github/workflows/agent_base_check.yaml'

  pull_request:
    branches: [main, master]
    paths:
      - 'src/agent/base.py'
      - 'tests/test_base_agent.py'
      - '.github/workflows/agent_base_check.yaml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi httpx uvicorn langchain langchain-ollama
      
      - name: Run registry tests
        run: python -m pytest tests/test_base_agent.py -v